name: Research Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  benchmark-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for new model versions
        id: new-versions
        run: |
          npm run research:check-versions
        env:
          OPENAI_WHISPER_API_KEY: ${{ secrets.OPENAI_WHISPER_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Benchmark new models (STT)
        run: |
          npm run research:benchmark -- --type stt
        env:
          OPENAI_WHISPER_API_KEY: ${{ secrets.OPENAI_WHISPER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Benchmark new models (Translation)
        run: |
          npm run research:benchmark -- --type translation
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Benchmark new models (TTS)
        run: |
          npm run research:benchmark -- --type tts
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Auto-switch models if improved
        id: switch
        run: |
          npm run research:auto-switch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Check for quality degradation
        run: |
          npm run research:check-degradation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Search arxiv for papers (Mondays only)
        run: |
          if [ $(date +%u) -eq 1 ]; then
            npm run research:arxiv-search
          fi
        continue-on-error: true

      - name: Create PR for model upgrades
        if: steps.switch.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const improvements = JSON.parse(fs.readFileSync('improvements.json', 'utf8'));

            if (improvements.length === 0) {
              console.log('No improvements to suggest');
              return;
            }

            let body = '## 🤖 Automated Model Improvements\n\n';
            improvements.forEach(imp => {
              body += `- ${imp.type.toUpperCase()}: ${imp.from} → ${imp.to} (+${(imp.improvement * 100).toFixed(1)}%)\n`;
            });

            body += '\n**Action**: Review benchmarks and merge if approved';

            github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto: Model upgrades detected',
              head: 'feature/model-upgrades',
              base: 'main',
              body: body,
              draft: false,
              labels: ['auto-generated', 'research-pipeline']
            }).then(pr => {
              console.log(`Created PR: ${pr.data.html_url}`);
            }).catch(err => {
              console.log('PR creation skipped:', err.message);
            });

      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Research Pipeline Run",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Research Pipeline Results*\n${{ job.status == 'success' && '✅' || '❌' }} Daily benchmarks completed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "New Versions: ${{ steps.new-versions.outputs.count || '0' }}\nModels Improved: ${{ steps.switch.outcome == 'success' && '1+' || '0' }}"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Archive research results
        uses: actions/upload-artifact@v3
        with:
          name: research-results-${{ github.run_number }}
          path: |
            benchmarks.json
            improvements.json
            degradation-report.json
        if-no-files-found: ignore

  monitor-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Monitor active model performance
        run: |
          npm run research:monitor-metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
